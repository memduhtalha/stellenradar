[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "werkstudent"
version = "0.1.0"
description = "Telegram-Bot, der Werkstudentenstellen rund um Düsseldorf findet"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21,<22",
    "httpx>=0.27",
    "playwright==1.64.1",
    "selectolax>=0.3.21",
    "PyYAML>=6",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Fehler, Warnungen, Import-Reihenfolge, typische Bugs, moderne Syntax
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # lange Zeilen (Texte/URLs) sind hier ok

[tool.ruff.lint.per-file-ignores]
# Tests: nachträglich ergänzte Importe und kompakte Einzeiler sind dort in Ordnung
"tests/**" = ["E402", "E702"]
